{% extends "core/base.html" %}

{% block title %}Crear/Editar Curso{% endblock %}

{% block content %}
<h1>{% if curso %}Editar{% else %}Crear{% endif %} Curso</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="{% if curso %}btn-editar{% else %}btn-crear{% endif %}">
        {% if curso %}Actualizar{% else %}Guardar{% endif %}
    </button>
    <a href="{% url 'curso' %}" class="btn-cancelar">Cancelar</a>
</form>
{% endblock %}
