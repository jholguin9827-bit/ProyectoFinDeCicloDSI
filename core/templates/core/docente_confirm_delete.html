{% extends "core/base.html" %}

{% block title %}Eliminar Docente{% endblock %}

{% block content %}
<h1>Eliminar Docente</h1>
<p>¿Seguro que deseas eliminar a {{ docente.nombre }} {{ docente.apellido }}?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn-eliminar">Sí, eliminar</button>
    <a href="{% url 'docente' %}" class="btn-cancelar">Cancelar</a>
</form>
{% endblock %}
