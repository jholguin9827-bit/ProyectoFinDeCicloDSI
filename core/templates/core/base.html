<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema Académico{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 10px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; background-color: #fff; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #eee; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .errorlist { color: red; margin: 5px 0; }
        form { background-color: #fff; padding: 15px; border: 1px solid #ccc; width: 50%; margin-top: 10px; }

        /* Botones */
        .btn-crear {
            background-color: #4CAF50; color: white; border: 2px solid #388E3C; border-radius: 4px;
            padding: 5px 12px; text-decoration: none; margin-right: 5px;
        }
        .btn-crear:hover { background-color: #45a049; }

        .btn-editar {
            background-color: #FFC107; color: black; border: 2px solid #FFA000; border-radius: 4px;
            padding: 5px 12px; text-decoration: none; margin-right: 5px;
        }
        .btn-editar:hover { background-color: #FFB300; }

        .btn-eliminar {
            background-color: #F44336; color: white; border: 2px solid #D32F2F; border-radius: 4px;
            padding: 5px 12px; text-decoration: none; margin-right: 5px;
        }
        .btn-eliminar:hover { background-color: #E53935; }

        .btn-cancelar {
            background-color: white; color: #F44336; border: 2px solid #F44336; border-radius: 4px;
            padding: 5px 12px; text-decoration: none; margin-right: 5px;
        }
        .btn-cancelar:hover { background-color: #fdd; }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'inicio' %}">Inicio</a>
    <a href="{% url 'estudiante' %}">Estudiantes</a>
    <a href="{% url 'docente' %}">Docentes</a>
    <a href="{% url 'periodo' %}">Periodos</a>
    <a href="{% url 'curso' %}">Cursos</a>
    <a href="{% url 'inscripcion' %}">Inscripciones</a>
</nav>

<hr>

{% block content %}{% endblock %}

</body>
</html>
