{% extends "core/base.html" %}

{% block title %}Eliminar Estudiante{% endblock %}

{% block content %}
<h1>Eliminar Estudiante</h1>
<p>¿Seguro que deseas eliminar a {{ estudiante.nombre }}?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn-eliminar">Sí, eliminar</button>
    <a href="{% url 'estudiante' %}" class="btn-cancelar">Cancelar</a>
</form>
{% endblock %}
