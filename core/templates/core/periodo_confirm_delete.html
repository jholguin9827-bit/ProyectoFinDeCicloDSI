{% extends "core/base.html" %}

{% block title %}Eliminar Periodo{% endblock %}

{% block content %}
<h1>Eliminar Periodo</h1>
<p>¿Seguro que deseas eliminar el periodo {{ periodo.nombre }}?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn-eliminar">Sí, eliminar</button>
    <a href="{% url 'periodo' %}" class="btn-cancelar">Cancelar</a>
</form>
{% endblock %}
