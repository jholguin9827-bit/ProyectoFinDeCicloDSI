{% extends "core/base.html" %}

{% block title %}Crear/Editar Docente{% endblock %}

{% block content %}
<h1>{% if docente %}Editar{% else %}Crear{% endif %} Docente</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="{% if docente %}btn-editar{% else %}btn-crear{% endif %}">
        {% if docente %}Actualizar{% else %}Guardar{% endif %}
    </button>
    <a href="{% url 'docente' %}" class="btn-cancelar">Cancelar</a>
</form>
{% endblock %}
