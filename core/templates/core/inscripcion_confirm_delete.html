{% extends "core/base.html" %}

{% block title %}Eliminar Inscripción{% endblock %}

{% block content %}
<h1>Eliminar Inscripción</h1>
<p>¿Seguro que deseas eliminar la inscripción de {{ inscripcion.estudiante }} al curso {{ inscripcion.curso }}?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn-eliminar">Sí, eliminar</button>
    <a href="{% url 'inscripcion' %}" class="btn-cancelar">Cancelar</a>
</form>
{% endblock %}
