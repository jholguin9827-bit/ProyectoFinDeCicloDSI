{% extends "core/base.html" %}

{% block title %}Eliminar Curso{% endblock %}

{% block content %}
<h1>Eliminar Curso</h1>
<p>¿Seguro que deseas eliminar el curso {{ curso.nombre }}?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn-eliminar">Sí, eliminar</button>
    <a href="{% url 'curso' %}" class="btn-cancelar">Cancelar</a>
</form>
{% endblock %}
